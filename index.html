<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ប្រព័ន្ធគ្រប់គ្រង និងកត់ត្រាអ្នកជំងឺពិគ្រោះក្រៅ (មណ្ឌលសុខភាព)</title>
    <!-- Google Fonts for Khmer -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Kantumruy Pro"', 'Battambang', 'Inter', 'sans-serif'],
              khmer: ['"Kantumruy Pro"', 'Battambang', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
              },
              moh: {
                blue: '#1b4d89',
                teal: '#0d9488',
                green: '#15803d',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Kantumruy Pro', 'Battambang', 'Inter', sans-serif;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        @page {
          size: landscape;
          margin: 6mm;
        }
        body {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
          background: white !important;
          color: black !important;
        }
      }
      /* Custom scrollbar for wide 32-column table */
      ::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
